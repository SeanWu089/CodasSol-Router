name: Cloudflare witness v0.3 checks

on:
  push:
    branches:
      - feat/cloudflare-witness-v0.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Node test dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Verify independent witness state and Router HTTP client
        run: node --test test/cloudflare-witness.test.js
      - name: Verify full Linux Node suite
        run: node --test
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/codassol-witness-bundle --config deploy/cloudflare-witness/wrangler.jsonc
      - name: Exercise isolated Cloudflare workerd HTTP runtime
        run: node scripts/test-witness-worker-runtime.mjs
