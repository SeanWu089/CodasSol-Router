name: Windows standalone node source checks

on:
  push:
    branches:
      - release/windows-rc1-public
      - fix/windows-rc1-recovery
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node unit tests
        run: npm test
      - name: PowerShell syntax validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem 'scripts/windows' -Filter *.ps1 -Recurse |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                throw "PowerShell parse error in $($_.FullName): $($errors -join '; ')"
              }
              Write-Host "PASS $($_.Name)"
            }

      - name: Isolated recovery failure injection (no live task or process mutation)
        shell: powershell
        run: ./test/windows/recovery-faults.ps1
      - name: Original rc.1 saved-task format and malicious-record regression
        shell: powershell
        run: ./test/windows/saved-task-format.ps1

      - name: Clean installation isolation and failure tests
        shell: powershell
        run: ./test/windows/clean-faults.ps1
      - name: Pinned DevSpace private config compatibility
        shell: powershell
        timeout-minutes: 12
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'codas-clean-fixture'
          npm install --prefix (Join-Path $root 'devspace') --no-audit --no-fund --fetch-retries=1 '@waishnav/devspace@1.1.0-beta.4'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency install failed' }
          node scripts/windows/clean/config-ci.mjs $root
          if ($LASTEXITCODE -ne 0) { throw 'Private config compatibility failed' }
      - name: Actual PowerShell 5.1 wrapper and child process regression
        shell: powershell
        run: ./test/windows/clean-process.ps1
      - name: Desktop resume scope guard
        shell: powershell
        run: ./test/windows/resume-desktop.ps1
