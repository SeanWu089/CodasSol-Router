name: Windows standalone node source checks

on:
  push:
    branches:
      - release/windows-rc1-public
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node unit tests
        run: npm test
      - name: PowerShell syntax validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem 'scripts/windows/standalone' -Filter *.ps1 -Recurse |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                throw "PowerShell parse error in $($_.FullName): $($errors -join '; ')"
              }
              Write-Host "PASS $($_.Name)"
            }
